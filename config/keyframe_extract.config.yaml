# 关键帧提取配置文件
# 此配置用于从视频中提取关键帧并重新渲染

# 处理模式：keyframe（关键帧提取）
mode: "keyframe"

# 关键帧提取选项
keyframe_options:
  # 帧差异阈值 (0.0-1.0)
  # 数值越小，越容易检测到变化，会产生更多关键帧
  # 数值越大，只在显著变化时才提取关键帧，关键帧数量更少
  # 推荐范围: 0.1 - 0.5
  threshold: 0.2
  
  # 最小关键帧间隔（秒）
  # 避免在短时间内提取过多关键帧
  # 推荐范围: 0.5 - 10.0
  min_interval: 5.0

# 输出设置
output_format: "mp4"
output_dir: "./dist/keyframe"
output_suffix: "_keyframes"
output_template: "$name$custom.$ext"

# 注意：关键帧提取模式下，以下 FFmpeg 相关配置将被忽略
# global_options, input_options, output_options 仅在 mode: "convert" 时生效
