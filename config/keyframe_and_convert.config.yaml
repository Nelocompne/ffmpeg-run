# 关键帧提取 + 转换 组合配置文件
# 此配置先提取关键帧，然后对关键帧视频进行编码转换（流水线处理）

# 处理模式：both（关键帧提取 + FFmpeg 转换）
mode: "both"

# 关键帧提取选项
keyframe_options:
  # 帧差异阈值 (0.0-1.0)
  # 数值越小，越容易检测到变化，会产生更多关键帧
  # 推荐: 录播视频 0.15-0.25, 一般视频 0.25-0.35
  threshold: 0.2
  
  # 最小关键帧间隔（秒）
  # 避免在短时间内提取过多关键帧
  # 推荐: 录播视频 3-10秒, 一般视频 0.5-2秒
  min_interval: 5.0

# FFmpeg 全局选项
global_options:
  - "-y"                     # 覆盖输出文件
  - "-hwaccel"
  - "auto"                   # 硬件加速

# FFmpeg 输入选项（作用于 -i 之前）
input_options: []

# FFmpeg 输出选项（编码参数）
output_options:
  - "-c:v"
  - "hevc_nvenc"             # NVIDIA GPU HEVC 编码
  - "-rc"
  - "vbr"                    # 可变比特率
  - "-cq"
  - "28"                     # 质量 (0-51, 越小质量越好)
  - "-preset"
  - "p4"                     # 预设 (p1最快-p7最慢)
  - "-c:a"
  - "aac"                    # 音频编码
  - "-b:a"
  - "128k"                   # 音频比特率
  - "-movflags"
  - "+faststart"             # 优化网络播放

# 输出设置
output_format: "mkv"
output_dir: "./dist/keyframe_converted"
output_suffix: "_kf_hevc"
output_template: "$name$custom.$ext"

# 说明：
# 1. 先使用 OpenCV 提取关键帧并生成临时视频（保留原音频）
# 2. 然后使用 FFmpeg 对临时视频进行编码转换
# 3. 最后删除临时文件，保留最终输出
# 
# 优势：大幅减少视频大小（关键帧压缩 + 高效编码）
# 适用场景：录播视频、直播录制、教程视频等静态画面较多的内容
